buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://repo1.maven.org/maven2' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:12.2.4"
    }
}

/* gets the version name from the latest Git tag, stripping the leading v off */
def getVersionName = { ->
    def out = providers.exec {
        commandLine 'git', 'describe', '--tags', '--always', '--abbrev=0'
    }.standardOutput.asText.get().trim()
    return out
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.mikepenz.aboutlibraries.plugin'

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://repo1.maven.org/maven2' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }

    project.ext {
        version_number = getVersionName()
        group_info = "haven"
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        targetSdkVersion = 36
    }
}

// Release signing: credentials live in keystore.properties (git-ignored). Without that
// file the release build stays unsigned, so CI / a fresh clone still builds.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {

    tasks.withType(JavaCompile) {
        options.compilerArgs += ["-Xlint:unchecked"]
    }

    compileSdk 36

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                enableV1Signing false   // minSdk 24 -> v1 (JAR) not needed
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.work:work-runtime:2.8.1'
            force 'androidx.work:work-runtime-ktx:2.8.1'  // Update to match work-runtime version
            // tor-android 0.4.9.5 asks for kotlin-stdlib 2.3.0; hold it at our compiler's
            // version so a 2.1 kotlinc doesn't choke on newer stdlib metadata.
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
            // gson arrives only transitively; hold it at a version without the known
            // 2.10.x deserialization DoS rather than declaring a dep we don't use.
            force 'com.google.code.gson:gson:2.13.1'
        }
    }

    defaultConfig {
        applicationId "org.havenapp.main"
        versionCode 2001
        versionName getVersionName()
        archivesBaseName = "Haven-$versionName"
        minSdkVersion 24
        targetSdkVersion 36
        ndkVersion '28.2.13676358'

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        ndk {
            // "armeabi" was removed from the NDK long ago; "x86" is emulator-only 32-bit.
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // keep debug builds fast + fully inspectable
            minifyEnabled false
        }
    }

    compileOptions {
        // Java 21: info.guardianproject:tor-android 0.4.9.x ships Java-21 bytecode, and it's
        // the first line that's 16 KB-page aligned. Needs the build to run on JDK 21.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        // Enable core library desugaring
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "21"
    }


    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all { it.systemProperty 'robolectric.logging.enabled', 'false' }
    }
    namespace 'org.havenapp.main'
}

configurations {
    all*.exclude group: 'com.google.guava', module: 'listenablefuture'
}

dependencies {
    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.work:work-runtime:2.8.1'
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // CameraX - service-owned camera pipeline (Phase 3)
    def camerax_version = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-video:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'androidx.lifecycle:lifecycle-service:2.9.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    // At-rest encryption: Keystore-backed AEAD for media + backups
    implementation 'com.google.crypto.tink:tink-android:1.13.0'
    // QR encode/decode for parent<->child pairing (pure-Java, no android deps)
    implementation 'com.google.zxing:core:3.5.3'
    // Optional built-in Tor (SOCKS proxy) so Orbot isn't required. Bundles the native
    // tor binary per ABI (~7-8 MB each), Java-21 bytecode, 16 KB-page aligned .so files.
    // On compileSdk 36 we can now go up to 0.4.9.6 (minCompileSdk 36); 0.4.9.6.2+ want
    // compileSdk 37. Using 0.4.9.6 now.
    implementation 'info.guardianproject:tor-android:0.4.9.6'
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    // Encrypted event database
    implementation 'net.zetetic:sqlcipher-android:4.6.1'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // On-device person detection; model delivered via Play Services so the APK stays
    // small. ML Kit auto-selects NNAPI / GPU where available.
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'

    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    implementation 'info.guardianproject.netcipher:netcipher:2.1.0'
    implementation 'org.nanohttpd:nanohttpd-webserver:2.3.1'
    implementation 'me.angrybyte.picker:picker:1.3.1'
    implementation 'com.github.stfalcon-studio:StfalconImageViewer:1.0.1'
    implementation 'com.github.derlio:audio-waveform:v1.0.1'
    implementation 'com.github.massoudss:waveformSeekBar:5.0.2'
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.11'
    implementation 'com.mikepenz:aboutlibraries:12.2.4'

    // Media3 (ExoPlayer's successor; the old com.google.android.exoplayer:2.x is EOL)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // Match Kotlin version
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // Room
    implementation 'androidx.room:room-runtime:2.7.2'
    kapt 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'

    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.9.2'

    // Test helpers
    testImplementation 'androidx.room:room-testing:2.7.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'androidx.work:work-testing:2.8.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.7.2'

    // Periodic background work (storage cleanup). Replaces the unmaintained
    // com.evernote:android-job. work-runtime is already forced to 2.8.1 above.
}